# ============================================================================
#  Hesab — Render Blueprint
#  Render.com → New → Blueprint → bu repoyu seçin.
#  Static Site: build yoxdur, server yoxdur, yalnız statik fayllar.
# ============================================================================
services:
  - type: web
    name: hesab-emekhaqqi
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.11.1
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
